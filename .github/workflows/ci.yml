name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: |
            ~/Documents/PowerShell/Modules
            ~/Documents/WindowsPowerShell/Modules
          key: ps-modules-${{ runner.os }}-v1

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          Install-Module -Name Pester -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck -MaximumVersion 5.99.99

      - name: Run Pester tests
        shell: pwsh
        run: |
          $res = Invoke-Pester tests/Optimize.Core.Tests.ps1 -PassThru
          if (-not $res) { Write-Error "Pester 未返回结果"; exit 1 }
          if ($res.FailedCount -gt 0) { Write-Error "Pester 失败 $($res.FailedCount) 项"; exit 1 }
          Write-Host "Pester 通过：$($res.PassedCount) 项"

      - name: Run PSScriptAnalyzer (report only, non-blocking)
        shell: pwsh
        run: |
          $paths = @('scripts', 'webui/ps', 'lib', 'gui', 'Optimize.ps1', 'OptimizeGUI.ps1', 'Build-EXE.ps1')
          $errs = @()
          foreach ($p in $paths) {
            if (Test-Path $p) {
              $errs += Invoke-ScriptAnalyzer -Path $p -Recurse -Severity Error -ErrorAction SilentlyContinue
            }
          }
          if ($errs) {
            Write-Host "PSScriptAnalyzer 发现 $($errs.Count) 个 Error 级问题（当前仅报告，不阻断构建，可后续收紧为 fail）："
            $errs | Format-Table -AutoSize
          } else {
            Write-Host "PSScriptAnalyzer：无 Error 级问题"
          }
