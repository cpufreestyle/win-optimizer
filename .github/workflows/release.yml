# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell module ps2exe
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module -Name ps2exe -Force -Scope CurrentUser

      - name: Build EXE
        shell: pwsh
        run: |
          ./Build-EXE.ps1

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'PC-Optimizer.exe')) { throw "PC-Optimizer.exe not found after build" }
          $v = (Get-Item 'PC-Optimizer.exe').VersionInfo.ProductVersion
          Write-Host "Built PC-Optimizer.exe (ProductVersion: $v)"

      - name: Prepare release notes
        shell: pwsh
        run: ./tools/gen-notes.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: PC-Optimizer.exe
          body_path: ${{ env.NOTES_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
